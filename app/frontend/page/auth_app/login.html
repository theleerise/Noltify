<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Noltify - Iniciar sesion
    </title>
    <link rel="icon" type="image/svg+xml" href="{{ static('img/favicon.svg') }}">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS GLOBAL DEL PROYECTO -->
    <link rel="stylesheet" href="{{ static('css/style.css') }}">
</head>

<body class="auth-page">
    <div id="app-alert-message-container" aria-live="polite" aria-atomic="true"></div>
    {% if error_message %}
    <div class="d-none" id="auth-login-flash-messages">
        <div data-alert-flash data-alert-type="error">{{ error_message }}</div>
    </div>
    {% endif %}

    <main class="auth-shell">
        <section class="auth-hero">
            <div class="auth-brand">
                <span class="auth-brand-mark"><i class="bi bi-shield-lock"></i></span>
                <div>
                    <div class="auth-brand-title">Noltify</div>
                    <div class="auth-brand-subtitle">Acceso privado a documentos y publicaciones</div>
                </div>
            </div>

            <div class="auth-copy">
                <h1>Inicia sesion</h1>
                <p>Accede con tu usuario o email y tu contrasena.</p>
            </div>
        </section>

        <section class="auth-panel">
            <div class="card auth-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="h4 mb-2">Bienvenido de nuevo</h2>
                        <p class="text-secondary mb-0">Introduce tus credenciales para continuar.</p>
                    </div>

                    <form method="post" class="auth-form" novalidate>
                        {{ csrf_input }}
                        <input type="hidden" name="next" value="{{ next_url }}">

                        <div class="mb-3">
                            <label for="id_login" class="form-label">Usuario o email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="id_login"
                                    name="login"
                                    value="{{ login_value }}"
                                    autocomplete="username"
                                    required
                                    autofocus
                                >
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label">Contrasena</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="id_password"
                                    name="password"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 auth-submit">
                            Entrar
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="{{ static('js/alert-message.js') }}"></script>
</body>

</html>
