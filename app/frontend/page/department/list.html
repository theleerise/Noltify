{% extends "base.html" %}
{% from 'macro/component.jinja2' import mac_list_title %}

{% block title %}
 - Departamentos
{% endblock %}

{% block content %}

{{ mac_list_title("Departamentos") }}

<div>
    <div filters_name="department-filters" class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <a class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" href="#department-filters-collapse">Filtros</a>
                <a class="btn btn-sm btn-outline-primary" onclick="window.departmentOpenNew()">Crear</a>
            </div>
            <div filters_actions="department-filters-actions"></div>
        </div>
        <div class="collapse" id="department-filters-collapse">
            <div class="card-body">
                <div filters_form="department-filters-form"></div>
            </div>
        </div>
    </div>

    <div summary_name="department-table-summary"></div>
    <div table_name="department-table"></div>
    <div pagination_name="department-table-pagination"></div>
</div>

<div id="department-modal-container"></div>

<script type="module">
    import RenderPaginateTable from "/static/js/render-paginate-table.js";
    import RenderTableFilters from "/static/js/render-table-filters.js";
    import ModalFormManager from "/static/js/modal-form-manager.js";
    import { deleteModal } from "/static/js/modals.js";

    const entityConfig = {{ entity_model|safe }};
    const visibleColumns = ["code", "name", "description", "is_active", "created_at", "updated_at"];
    const filtersColumns = ["id", "code", "name", "description", "is_active", "created_at", "updated_at"];

    function buildFilter(fieldName, value) {
        return {
            page: 1,
            orders: {},
            filters: {
                [fieldName.toUpperCase()]: {
                    type: "integer",
                    filter: "EQUAL",
                    values: value
                }
            }
        };
    }

    const table = new RenderPaginateTable({
        tableName: "department-table",
        paginationContainerName: "department-table-pagination",
        summaryContainerName: "department-table-summary",
        entityConfig: entityConfig,
        columns: visibleColumns,
        buttons: {
            edit: {
                position: "start",
                title: "Editar",
                className: "btn-outline-primary",
                ButtonIconClass: "bi bi-pencil-square",
                action: (row) => {
                    window.departmentUserFilterValue = buildFilter("department_id", row.id);
                    window.departmentDocumentFilterValue = buildFilter("department_id", row.id);
                    window.departmentPublicationFilterValue = buildFilter("department_id", row.id);
                    window.entityFormMgr.openEdit(row.id);
                }
            },
            del: {
                position: "end",
                title: "Eliminar",
                className: "btn-outline-danger",
                ButtonIconClass: "bi bi-trash",
                action: (row) => {
                    deleteModal({
                        containerName: "department-modal-container",
                        url: `/department/delete/${row.id}/`,
                        headers: { "X-CSRFToken": getCookie("csrftoken") },
                        title: "Eliminar departamento",
                        message: `Seguro que deseas eliminar el departamento <strong>${row.name}</strong>?`,
                        onSuccess: (response, modal) => {
                            modal.close();
                            table.load();
                        },
                        onError: (error) => {
                            console.error(error);
                        }
                    });
                }
            }
        },
        url: "/department/data/",
        method: "GET",
        rowsPerPage: 10,
        autoLoad: false
    });

    const filters = new RenderTableFilters({
        filtersName: "department-filters",
        entityConfig: entityConfig,
        columns: filtersColumns,
        onSubmit: (currentFilters) => table.applyFilters(currentFilters),
        onReset: () => {
            table.setOrders({});
            table.applyFilters({});
        }
    });

    filters.render();
    table.load();

    window.departmentOpenNew = () => {
        window.departmentUserFilterValue = null;
        window.departmentDocumentFilterValue = null;
        window.departmentPublicationFilterValue = null;
        window.entityFormMgr.openNew();
    };

    window.entityFormMgr = new ModalFormManager({
        containerName: "department-modal-container",
        entityConfig: entityConfig,
        formUrl: "/department/form/",
        headers: { "X-CSRFToken": getCookie("csrftoken") },
        dataUrls: {
            new: "/department/new/",
            edit: (id) => `/department/edit/${id}/`
        },
        submitUrl: (mode, id) => mode === "new" ? "/department/create/" : `/department/update/${id}/`,
        modal: {
            titleNew: "Nuevo departamento",
            titleEdit: "Editar departamento",
            titleShow: "Detalle del departamento",
            size: "modal-lg"
        },
        onSuccess: (response, manager) => {
            manager.close();
            table.load();
        },
        onError: (error) => {
            console.error(error);
        }
    });
</script>

{% endblock %}
