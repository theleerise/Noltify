{% extends "base.html" %}
{% from 'macro/component.jinja2' import mac_list_title %}

{% block title %}
 - Documento
{% endblock %}

{% block content %}

{{ mac_list_title("Documentos") }}

<div>
    <div filters_name="document-filters" class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <a class="btn btn-sm btn-outline-secondary"
                data-bs-toggle="collapse"
                href="#document-filters-collapse">
                Filtros
                </a>
                <a class="btn btn-sm btn-outline-primary" onclick="window.entityFormMgr.openNew()">Crear</a>
            </div>
            <div filters_actions="document-filters-actions"></div>
        </div>
        <div class="collapse" id="document-filters-collapse">
            <div class="card-body">
                <div filters_form="document-filters-form"></div>
            </div>
        </div>
    </div>

    <div summary_name="document-table-summary"></div>
    <div table_name="document-table"></div>
    <div pagination_name="document-table-pagination"></div>
</div>

<div id="document-modal-container"></div>

<script type="module">
    import RenderPaginateTable from "/static/js/render-paginate-table.js";
    import RenderTableFilters from "/static/js/render-table-filters.js";
    import ModalFormManager from "/static/js/modal-form-manager.js";
    import { deleteModal } from "/static/js/modals.js";

    const entityConfig = {{ entity_model|safe }};
    console.log(entityConfig);

    //////////////////////////
    // Entity Table //////////
    //////////////////////////

    const visibleColumns = ["title", "file_name", "mime_type", "file_size", "uploaded_by", "is_active", "created_at", "updated_at"];

    const filtersColumns = ["id", "title", "file_name", "mime_type", "file_size", "uploaded_by", "is_active", "created_at", "updated_at"];

    const entityConfigButtons = {
        edit: {
            position: "start",
            title: "Editar",
            className: "btn-outline-primary",
            ButtonIconClass: "bi bi-pencil-square",
            action: (row) => {
                console.log(row);
                window.entityFormMgr.openEdit(row.id);
            }
        },
        doc: {
            position: "start",
            title: "Documento",
            className: "btn-outline-warning",
            ButtonIconClass: "bi bi-file-earmark-post",
            action: (row) => {
                window.open(`/document/file/${row.id}/`, "_blank", "noopener");
            }
        },
        del: {
            position: "end",
            title: "Eliminar",
            className: "btn-outline-danger",
            ButtonIconClass: "bi bi-trash",
            action: (row) => {
                deleteModal({
                    containerName: "document-modal-container",
                    url: `/document/delete/${row.id}/`,
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    title: "Eliminar documento",
                    message: `¿Seguro que deseas eliminar el documento <strong>${row.name}</strong>?`,
                    onSuccess: (response, modal) => {
                        modal.close();
                        console.log(response);
                        table.load();
                    },
                    onError: (error) => {
                        console.error(error);
                    }
                });
            }
        }
    };

    const table = new RenderPaginateTable({
        tableName: "document-table",
        paginationContainerName: "document-table-pagination",
        summaryContainerName: "document-table-summary",
        entityConfig: entityConfig,
        columns: visibleColumns,
        buttons: entityConfigButtons,
        url: "/document/data/",
        method: "GET",
        rowsPerPage: 10,
        autoLoad: false
    });

    const filters = new RenderTableFilters({
        filtersName: "document-filters",
        entityConfig: entityConfig,
        columns: filtersColumns,
        onSubmit: (currentFilters) => {
            table.applyFilters(currentFilters);
        },
        onReset: () => {
            table.setOrders({});
            table.applyFilters({});
        }
    });

    filters.render();
    table.load();

    //////////////////////////
    // Entity Form ///////////
    //////////////////////////

    window.entityFormMgr = new ModalFormManager({
        containerName: "document-modal-container",
        entityConfig: entityConfig,
        formUrl: "/document/form/",
        headers: {
            "X-CSRFToken": getCookie("csrftoken")
        },
        dataUrls: {
            new: "/document/new/",
            edit: (id) => `/document/edit/${id}/`
        },
        submitUrl: (mode, id) => {
            if (mode === "new") {
                return "/document/create/";
            }
            return `/document/update/${id}/`;
        },
        modal: {
            titleNew: "Nuevo documento",
            titleEdit: "Editar documento",
            titleShow: "Detalle del documento",
            size: "modal-lg"
        },
        onSuccess: (response, manager) => {
            manager.close();
            console.log(response);
            table.load();
        },
        onError: (error) => {
            console.error(error);
        }
    });
</script>

{% endblock %}
